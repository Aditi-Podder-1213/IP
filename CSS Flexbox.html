<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    .box-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background-color: #ddd;
      padding: 30px;
      border-radius: 50px;
    }

    .box-container div {
      flex: 0 1 60px;
      
      padding: 30px;
      background-color: steelblue;
      color: white;
      text-align: center;
      border-radius: 50%;
    }
  </style>

</head>

<body>

  <div class="box-container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
  </div>

</body>

</html>
